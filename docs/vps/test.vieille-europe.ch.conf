server {
    server_name test.vieille-europe.ch;
    root /var/www/v2-vieille-europe.ch/.site/current;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 64m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Assets from older releases remain available to already-open browser tabs.
    location ^~ /_astro/ {
        root /var/www/v2-vieille-europe.ch/.site/assets;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /_emdash/ {
        proxy_pass http://127.0.0.1:4321;
        include /etc/nginx/snippets/vieille-europe-emdash-proxy.conf;
    }
    location ^~ /preview/ {
        proxy_pass http://127.0.0.1:4321;
        include /etc/nginx/snippets/vieille-europe-emdash-proxy.conf;
    }
    location = /_image {
        proxy_pass http://127.0.0.1:4321;
        include /etc/nginx/snippets/vieille-europe-emdash-proxy.conf;
    }
    location ^~ /_server-islands/ {
        proxy_pass http://127.0.0.1:4321;
        include /etc/nginx/snippets/vieille-europe-emdash-proxy.conf;
    }
    location = /search { return 301 /search/$is_args$args; }
    location = /posts { return 301 /; }
    location = /posts/ { return 301 /; }
    location ~ ^/posts/([^/]+)/?$ { return 301 /blog/$1/; }
    location ~ ^/pages/([^/]+)/?$ { return 301 /$1/; }
    location = /search/ {
        proxy_pass http://127.0.0.1:4321;
        include /etc/nginx/snippets/vieille-europe-emdash-proxy.conf;
    }
    location ^~ /api/statistiques/ {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:4321;
        include /etc/nginx/snippets/vieille-europe-emdash-proxy.conf;
    }
    location = /statistiques { return 301 /statistiques/; }
    location = /statistiques/ {
        proxy_pass http://127.0.0.1:4321;
        include /etc/nginx/snippets/vieille-europe-emdash-proxy.conf;
    }
    location / {
        # Compatibility with preview links issued before the /preview/ pattern.
        if ($arg__preview != "") { rewrite ^ /preview$uri last; }
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/test.vieille-europe.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.vieille-europe.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name test.vieille-europe.ch;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://test.vieille-europe.ch$request_uri; }
}
